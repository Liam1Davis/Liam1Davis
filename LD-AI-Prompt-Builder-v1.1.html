`````<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Builder</title>
<style>
  /* ---------- Colour themes ---------- */
  :root,
  :root[data-theme="slate"]{
    --bg:#F8FAFC;
    --panel:#FFFFFF;
    --border:#E2E8F0;
    --text:#0F172A;
    --muted:#475569;
    --accent:#4F46E5;
    --accent-dark:#3730A3;
    --success-bg:#e8f7ee;
    --success-text:#1c6e3f;
    --error-bg:#fdecec;
    --error-text:#a92323;
    --radius:10px;
    --radius-lg:18px;
    --shadow-card:0 4px 20px -2px rgba(15,23,42,.08);
    --focus-ring:0 0 0 3px rgba(79,70,229,.15);
    --heading-font:inherit;
    --card-tag-bg:#EEF2FF;
    --card-tag-text:#4338CA;
    --btn-tint-bg:#EEF2FF;
    --btn-tint-hover:#E0E7FF;
    --btn-secondary-bg:#EEF0F4;
    --btn-secondary-hover:#E2E5EA;
    --code-bg:#EEF0F4;
    --input-bg:#FBFBFC;
    --input-focus-bg:#FFFFFF;
    --output-bg:#FBFBFC;
    --output-text:var(--text);
    --output-border:var(--border);
    --body-bg:var(--bg);
    --dot-grid:none;
    --watermark-color:rgba(15,23,42,.045);
    --readiness-bg:var(--panel);
    --stepper-line:var(--border);
  }
  :root[data-theme="aurora"]{
    --bg:#0C0A14;
    --panel:rgba(255,255,255,.045);
    --border:rgba(168,85,247,.28);
    --text:#F3F4F6;
    --muted:#D8B4FE;
    --accent:#A855F7;
    --accent-dark:#7C3AED;
    --success-bg:rgba(34,197,94,.14);
    --success-text:#86efac;
    --error-bg:rgba(239,68,68,.14);
    --error-text:#fca5a5;
    --radius:12px;
    --radius-lg:20px;
    --shadow-card:0 0 18px rgba(192,132,252,.16);
    --focus-ring:0 0 0 3px rgba(192,132,252,.35);
    --heading-font:inherit;
    --card-tag-bg:rgba(168,85,247,.18);
    --card-tag-text:#E9D5FF;
    --btn-tint-bg:rgba(168,85,247,.14);
    --btn-tint-hover:rgba(168,85,247,.24);
    --btn-secondary-bg:rgba(255,255,255,.06);
    --btn-secondary-hover:rgba(255,255,255,.1);
    --code-bg:rgba(255,255,255,.08);
    --input-bg:rgba(255,255,255,.03);
    --input-focus-bg:rgba(255,255,255,.07);
    --output-bg:rgba(255,255,255,.03);
    --output-text:var(--text);
    --output-border:rgba(168,85,247,.3);
    --body-bg:radial-gradient(ellipse at top, #17102B 0%, #09090E 65%);
    --dot-grid:radial-gradient(rgba(168,85,247,.16) 1px, transparent 1px);
    --watermark-color:rgba(243,244,246,.045);
    --readiness-bg:rgba(20,14,36,.55);
    --stepper-line:rgba(168,85,247,.28);
  }
  :root[data-theme="editorial"]{
    --bg:#FAF8F5;
    --panel:#F4EFE6;
    --border:#E6DFD3;
    --text:#2E2A25;
    --muted:#635746;
    --accent:#B45309;
    --accent-dark:#92400E;
    --success-bg:#EAF3E3;
    --success-text:#3F6212;
    --error-bg:#FBEAE5;
    --error-text:#9A3412;
    --radius:10px;
    --radius-lg:16px;
    --shadow-card:0 2px 10px rgba(46,42,37,.07);
    --focus-ring:0 0 0 3px rgba(180,83,9,.18);
    --heading-font:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    --card-tag-bg:#F1E4D0;
    --card-tag-text:#92400E;
    --btn-tint-bg:#F1E4D0;
    --btn-tint-hover:#E8D6BC;
    --btn-secondary-bg:#EFE7D8;
    --btn-secondary-hover:#E6DAC4;
    --code-bg:#EFE7D8;
    --input-bg:#FFFDFA;
    --input-focus-bg:#FFFFFF;
    --output-bg:#2A2620;
    --output-text:#F4EFE6;
    --output-border:#4A4136;
    --body-bg:var(--bg);
    --dot-grid:none;
    --watermark-color:rgba(46,42,37,.05);
    --readiness-bg:var(--panel);
    --stepper-line:var(--border);
  }
  :root{
    --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    --container:1160px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
      scroll-behavior:auto !important;
    }
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:var(--body-bg);
    color:var(--text);
    line-height:1.5;
    transition:background-color .2s ease, color .2s ease;
  }
  /* Subtle dot grid + extra glow layered on top of the existing Aurora
     background gradient (near-black surface it was designed for); kept
     faint enough to never compete with content, and removed at narrow
     widths so it can't muddy small-screen legibility. background-color
     above is the safety net so nothing ever shows through as plain white,
     however tall the page grows. Deliberately NOT background-attachment:
     fixed — that only paints one viewport's worth of image and leaves the
     rest of a long page uncovered. */
  :root[data-theme="aurora"] body{
    background-image:var(--dot-grid), radial-gradient(circle at 52% 6%, rgba(124,58,237,.16), transparent 34%), radial-gradient(ellipse at top, #17102B 0%, #09090E 65%);
    background-size:26px 26px, auto, auto;
    background-repeat:repeat, no-repeat, no-repeat;
  }
  @media (max-width:768px){
    :root[data-theme="aurora"] body{background-image:radial-gradient(ellipse at top, #17102B 0%, #09090E 65%);}
  }
  #app{
    max-width:960px;
    margin:0 auto;
    padding:32px 20px 64px;
    position:relative;
  }
  a{color:inherit;}

  /* ---------- Accessible focus visibility (keyboard users) ---------- */
  a:focus-visible,
  button:focus-visible,
  textarea:focus-visible,
  summary:focus-visible,
  [tabindex]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:4px;
  }

  /* ---------- Top bar: brand (left) + nav + Settings (right) ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    min-height:76px;
    padding:12px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    transition:background-color .2s ease, border-color .2s ease;
  }
  :root[data-theme="aurora"] .topbar{
    background:rgba(20,19,29,.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .topbar-left{
    display:flex;
    align-items:center;
    gap:22px;
    min-width:0;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    font-family:var(--heading-font);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-wordmark{
    font-weight:850;
    font-size:.95rem;
    letter-spacing:.055em;
    text-transform:uppercase;
    color:var(--text);
  }
  .brand:hover .brand-wordmark{color:var(--accent);}
  .brand-subtitle{
    font-size:.67rem;
    font-weight:650;
    font-style:italic;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:1px;
  }
  .brand-mark{
    width:32px;
    height:32px;
    border-radius:9px;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.78rem;
    font-weight:800;
    flex:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="aurora"] .brand-mark{
    background:linear-gradient(135deg,#A855F7,#7C3AED);
    box-shadow:0 0 20px rgba(168,85,247,.32);
  }
  .topbar-nav-link{
    font-size:.85rem;
    font-weight:700;
    color:var(--muted);
    text-decoration:none;
    padding:6px 2px;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .topbar-nav-link:hover{color:var(--text);}
  .topbar-nav-link.current{color:var(--accent);border-bottom-color:var(--accent);}
  .settings-wrap{
    position:relative;
    flex:none;
  }
  .settings-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:.85rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:background-color .15s ease, border-color .15s ease;
  }
  .settings-toggle:hover{background:var(--btn-secondary-bg);}
  .settings-toggle .gear-icon{font-size:1rem;line-height:1;}
  .settings-panel{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    width:min(300px, calc(100vw - 32px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.16);
    padding:16px;
    transition:background-color .2s ease, border-color .2s ease;
  }
  .settings-panel[hidden]{display:none;}
  :root[data-theme="aurora"] .settings-panel{
    background:rgba(20,14,36,.96);
    border-color:rgba(168,85,247,.4);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .settings-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .settings-panel-title{
    font-size:.85rem;
    font-weight:700;
    color:var(--text);
  }
  .settings-close-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-size:.95rem;
    line-height:1;
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .settings-close-btn:hover{background:var(--btn-secondary-bg);color:var(--text);}
  .settings-section{margin-bottom:16px;}
  .settings-section:last-child{margin-bottom:0;}
  .settings-section h4{
    margin:0 0 8px;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    font-weight:700;
  }
  .settings-folder-status{
    font-size:.82rem;
    color:var(--muted);
    margin:0 0 10px;
    line-height:1.4;
  }
  .theme-switcher{display:flex;flex-direction:column;gap:5px;}
  .theme-swatch{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    padding:7px 9px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-size:.85rem;
    font-weight:600;
    font-family:inherit;
    text-align:left;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .theme-swatch:hover{background:var(--btn-secondary-bg);}
  .theme-swatch.active{border-color:var(--accent);background:var(--btn-tint-bg);}
  .swatch-dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .swatch-check{margin-left:auto;color:var(--accent);visibility:hidden;font-size:.9rem;}
  .theme-swatch.active .swatch-check{visibility:visible;}
  .theme-swatch[data-theme-btn="slate"] .swatch-dot{background:#4F46E5;}
  .theme-swatch[data-theme-btn="aurora"] .swatch-dot{background:linear-gradient(135deg,#A855F7,#EC4899);}
  .theme-swatch[data-theme-btn="editorial"] .swatch-dot{background:#B45309;}
  @media (max-width:600px){
    .topbar{padding:10px 14px;min-height:64px;}
    .topbar-left{gap:14px;}
    .brand-wordmark{font-size:.82rem;}
    .brand-subtitle{font-size:.6rem;letter-spacing:.06em;}
    .topbar-nav-link{display:none;}
    .brand-mark{width:28px;height:28px;font-size:.68rem;}
    .settings-toggle{padding:7px 12px;font-size:.8rem;}
  }

  /* ---------- Aurora theme: glass panels & glow ---------- */
  :root[data-theme="aurora"] .card,
  :root[data-theme="aurora"] .fields,
  :root[data-theme="aurora"] .readiness-panel{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  :root[data-theme="aurora"] .btn.primary{
    background:linear-gradient(135deg,#A855F7,#EC4899);
    box-shadow:0 0 16px rgba(192,132,252,.3);
  }
  :root[data-theme="aurora"] .btn.primary:hover{
    background:linear-gradient(135deg,#A855F7,#EC4899);
    filter:brightness(1.12);
  }

  /* ---------- Shared page header (home + framework pages) ---------- */
  .home-header h1,
  .fw-header h1{
    font-weight:800;
    letter-spacing:-0.02em;
    color:var(--text);
    font-family:var(--heading-font);
    margin-left:1.5in;
  }
  @media (max-width:600px){
    /* 1.5in would overrun a phone screen, so scale the indent down to
       something that still reads as an indent without breaking layout. */
    .home-header h1,
    .fw-header h1{
      margin-left:24px;
    }
  }
  .header-divider{
    border:none;
    border-top:1px solid var(--border);
    margin:22px 0 28px;
  }

  /* ---------- Home page ---------- */
  .home-header h1{
    font-size:3.12rem;
    margin-top:0;
    margin-bottom:12px;
  }
  .hero-subtitle{
    color:var(--muted);
    font-size:1.05rem;
    line-height:1.55;
    max-width:640px;
    margin:0 0 22px;
  }
  .hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
  }
  .hero-guide{margin:0 0 30px;}
  .hero-guide summary{
    cursor:pointer;
    font-size:.85rem;
    font-weight:700;
    color:var(--accent);
    list-style:none;
  }
  .hero-guide summary::-webkit-details-marker{display:none;}
  .hero-guide summary:hover{text-decoration:underline;}
  .hero-guide[open] summary{margin-bottom:12px;}
  .hero-guide-body{
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    color:var(--text);
    font-size:.9rem;
    line-height:1.6;
  }
  .feature-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:0;
    margin-bottom:36px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 26px;
    box-shadow:var(--shadow-card);
  }
  .feature-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:0 14px;
  }
  .feature-item + .feature-item{border-left:1px solid var(--border);}
  .feature-badge{
    flex:none;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.82rem;
    font-weight:700;
  }
  .feature-content h3{
    margin:0 0 4px;
    font-size:.98rem;
    font-weight:700;
    color:var(--text);
  }
  .feature-content p{
    margin:0;
    font-size:.87rem;
    color:var(--muted);
    line-height:1.45;
  }
  .section-label{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:700;
    color:var(--muted);
    margin:0 0 14px;
  }
  @media (max-width:720px){
    .feature-row{grid-template-columns:1fr;gap:16px;padding:18px;}
    .feature-item + .feature-item{border-left:none;border-top:1px solid var(--border);padding-top:16px;}
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
    align-items:stretch;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--card-accent, var(--accent));
    border-radius:var(--radius);
    padding:20px;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow-card);
    transition:transform .18s ease, box-shadow .18s ease, background-color .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -6px rgba(15,23,42,.16);}
  :root[data-theme="aurora"] .card:hover{box-shadow:0 0 26px rgba(192,132,252,.22);}
  @media (prefers-reduced-motion: reduce){
    .card:hover{transform:none;}
  }
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .card-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--card-tag-text);
    background:var(--card-tag-bg);
    padding:3px 8px;
    border-radius:20px;
    align-self:flex-start;
  }
  .card-motif{flex:none;color:var(--card-accent, var(--accent));opacity:.85;}
  .card-motif svg{display:block;width:28px;height:28px;}
  .card h2{
    margin:0 0 8px;
    font-size:1.25rem;
    font-family:var(--heading-font);
  }
  .card p{
    color:var(--muted);
    font-size:.92rem;
    flex-grow:1;
    margin:0 0 16px;
  }
  .home-footer{
    margin-top:36px;
  }

  /* ---------- Prominent info callout (file-naming / output note) ---------- */
  .info-note{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:14px 16px;
    margin:24px 0;
  }
  .info-note-icon{
    flex:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.78rem;
    font-weight:800;
  }
  .info-note p{
    margin:0;
    color:var(--text);
    font-size:.88rem;
    line-height:1.55;
  }
  .info-note code{
    background:var(--code-bg);
    padding:2px 6px;
    border-radius:4px;
    font-size:.85em;
  }

  /* ---------- Site-wide developer credit footer ---------- */
  .site-footer{
    max-width:960px;
    margin:0 auto;
    padding:8px 20px 28px;
    display:flex;
    justify-content:flex-end;
  }
  .dev-credit{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:0;
    font-size:.82rem;
    color:var(--muted);
  }
  .dev-logo{
    height:52px;
    width:auto;
    border-radius:5px;
    display:block;
  }
  @media (max-width:600px){
    .site-footer{padding:6px 14px 24px;justify-content:center;}
  }

  /* ---------- Buttons: primary (filled) / secondary (outline) / ghost (text link) ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    background:var(--btn-tint-bg);
    color:var(--accent-dark);
    min-height:40px;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .btn:hover{background:var(--btn-tint-hover);}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    box-shadow:inset 0 0 0 1.5px var(--border);
  }
  .btn.secondary:hover{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--btn-tint-bg);}
  .btn.ghost{
    background:transparent;
    color:var(--muted);
    padding-left:6px;
    padding-right:6px;
    min-height:auto;
  }
  .btn.ghost:hover{color:var(--accent);text-decoration:underline;background:transparent;}
  .btn.small{padding:8px 10px;font-size:.8rem;min-height:32px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--btn-tint-bg);}

  /* ---------- Framework page ---------- */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:20px;
    color:var(--accent);
    text-decoration:none;
    font-size:.9rem;
    font-weight:600;
    transition:color .15s ease;
  }
  .back-link:hover{color:var(--accent-dark);text-decoration:underline;}

  /* ---------- Framework identity band ---------- */
  .fw-identity{position:relative;overflow:hidden;}
  .fw-watermark{
    position:absolute;
    top:-0.35em;
    right:-0.05em;
    margin:0;
    font-size:7rem;
    font-weight:800;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--watermark-color);
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  @media (max-width:1099px){ .fw-watermark{font-size:5rem;} }
  @media (max-width:768px){ .fw-watermark{display:none;} }
  .fw-eyebrow-row{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .fw-eyebrow{
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .fw-motif{flex:none;display:inline-flex;color:var(--fw-accent, var(--accent));}
  .fw-motif svg{display:block;width:34px;height:34px;}
  .fw-header{position:relative;z-index:1;}
  .fw-header h1{
    margin-top:0;
    margin-bottom:10px;
    font-size:4.94rem;
  }
  .fw-stageline{
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--fw-accent, var(--accent));
    margin:0 0 12px;
    font-family:var(--font-mono);
  }
  .fw-header .fw-subheader{
    color:var(--muted);
    font-size:1rem;
    max-width:680px;
    margin:0;
  }
  .fw-guide{margin:18px 0 0;position:relative;z-index:1;}
  .fw-guide summary{
    cursor:pointer;
    font-size:.85rem;
    font-weight:700;
    color:var(--fw-accent, var(--accent));
    list-style:none;
    display:inline-block;
  }
  .fw-guide summary::-webkit-details-marker{display:none;}
  .fw-guide summary:hover{text-decoration:underline;}
  .fw-guide-body{
    margin-top:10px;
    background:var(--btn-tint-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    color:var(--text);
    font-size:.88rem;
    line-height:1.6;
  }

  /* ---------- Progress stepper ---------- */
  .fw-stepper-wrap{margin:26px 0 8px;position:relative;z-index:1;}
  .fw-stepper{
    display:flex;
    align-items:flex-start;
    gap:0;
    overflow-x:auto;
    padding-bottom:6px;
    -webkit-overflow-scrolling:touch;
  }
  .fw-step{
    display:flex;
    align-items:center;
    flex:none;
  }
  .fw-step-main{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;}
  .fw-step-dot{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid var(--border);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.62rem;
    font-weight:800;
    font-family:var(--font-mono);
    background:var(--panel);
    transition:background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .fw-step.is-complete .fw-step-dot{
    background:var(--fw-accent, var(--accent));
    border-color:var(--fw-accent, var(--accent));
    color:#fff;
  }
  .fw-step-label{
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    white-space:nowrap;
  }
  .fw-step.is-complete .fw-step-label{color:var(--text);}
  .fw-step-connector{
    width:32px;
    height:2px;
    background:var(--stepper-line);
    margin:9px 4px 0;
    flex:none;
    transition:background-color .18s ease;
  }
  .fw-step.is-complete + .fw-step .fw-step-connector,
  .fw-step-connector.is-filled{background:var(--fw-accent, var(--accent));}
  @media (max-width:600px){
    .fw-stepper-wrap::after{
      content:"";
      display:block;
    }
    .fw-step-main{min-width:60px;}
    .fw-step-connector{width:18px;}
  }

  /* ---------- Workspace layout: form column + Prompt Readiness column ---------- */
  .fw-workspace{
    display:grid;
    grid-template-columns:1fr;
    gap:26px;
    align-items:start;
    margin-top:22px;
  }
  @media (min-width:1100px){
    .fw-workspace{grid-template-columns:minmax(0,1fr) 300px;}
  }

  /* ---------- Staged fields ---------- */
  .fields{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:6px 20px;
    box-shadow:var(--shadow-card);
    transition:background-color .2s ease, border-color .2s ease;
  }
  .field-row{
    display:flex;
    gap:20px;
    padding:18px 0;
    border-bottom:1px solid var(--border);
    align-items:flex-start;
    border-left:3px solid transparent;
    transition:border-color .18s ease;
  }
  .field-row.is-complete{border-left-color:var(--fw-accent, var(--accent));}
  .field-row:last-child{border-bottom:none;}
  .field-label{
    flex:0 0 34%;
    max-width:34%;
  }
  .field-stage-title{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  .field-stage-num{
    font-family:var(--font-mono);
    font-size:.72rem;
    font-weight:700;
    color:var(--fw-accent, var(--accent));
    flex:none;
  }
  .field-label label{
    display:inline;
    font-weight:600;
    font-size:.95rem;
    color:var(--text);
  }
  .field-help{
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:6px;
  }
  .field-tip{
    color:var(--muted);
    font-size:.76rem;
    font-style:italic;
    margin:0;
  }
  .field-input{flex:1;}
  .field-input textarea{
    width:100%;
    resize:vertical;
    font-family:inherit;
    font-size:16px; /* 16px minimum avoids automatic zoom on iOS Safari */
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--input-bg);
    color:var(--text);
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .field-input textarea::placeholder{color:var(--muted);opacity:.75;}
  .field-input textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--input-focus-bg);
    box-shadow:var(--focus-ring);
  }
  @media (max-width:640px){
    .field-row{flex-direction:column;}
    .field-label{max-width:100%;}
  }

  .action-bar{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .status{
    margin-top:12px;
    font-size:.9rem;
    padding:0;
  }
  .status.success{color:var(--success-text);background:var(--success-bg);padding:9px 12px;border-radius:8px;}
  .status.error{color:var(--error-text);background:var(--error-bg);padding:9px 12px;border-radius:8px;}

  .preview-section{margin-top:28px;}
  .preview-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .preview-header-text h3{
    margin:0 0 2px;
    font-size:.78rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text);
    font-weight:800;
  }
  .preview-status-line{
    margin:0;
    font-size:.78rem;
    color:var(--muted);
    font-family:var(--font-mono);
  }
  #preview-box{
    width:100%;
    font-family:var(--font-mono);
    font-size:16px; /* 16px minimum avoids automatic zoom on iOS Safari */
    padding:12px;
    border:1px solid var(--output-border);
    border-radius:8px;
    background:var(--output-bg);
    color:var(--output-text);
    resize:vertical;
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  /* ---------- Prompt Readiness panel ---------- */
  .readiness-panel{
    background:var(--readiness-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-card);
    position:sticky;
    top:96px;
  }
  @media (max-width:1099px){
    .readiness-panel{position:static;}
  }
  .readiness-title{
    margin:0 0 14px;
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .readiness-fw-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:.85rem;
    font-weight:700;
    color:var(--text);
    padding-bottom:12px;
    margin-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .readiness-fw-row .fw-accent-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--fw-accent, var(--accent));
    display:inline-block;margin-right:8px;
  }
  .readiness-list{
    list-style:none;
    margin:0 0 16px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .readiness-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:.83rem;
  }
  .readiness-item-name{color:var(--text);}
  .readiness-item-state{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:.75rem;
    font-weight:700;
    white-space:nowrap;
  }
  .readiness-item.is-complete .readiness-item-state{color:var(--success-text);}
  .readiness-item:not(.is-complete) .readiness-item-state{color:var(--muted);}
  .readiness-icon{flex:none;width:14px;height:14px;display:inline-block;}
  .readiness-section{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
  }
  .readiness-bar-track{
    width:100%;
    height:8px;
    border-radius:5px;
    background:var(--btn-secondary-bg);
    overflow:hidden;
    margin-bottom:6px;
  }
  .readiness-bar-fill{
    height:100%;
    background:var(--fw-accent, var(--accent));
    border-radius:5px;
    transition:width .25s ease;
  }
  .readiness-count{
    font-size:.8rem;
    color:var(--muted);
    margin:0 0 16px;
  }
  .readiness-next{
    background:var(--btn-tint-bg);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:14px;
  }
  .readiness-next-label{
    font-size:.68rem;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--fw-accent, var(--accent));
    margin:0 0 6px;
  }
  .readiness-next p{margin:0;font-size:.83rem;color:var(--text);line-height:1.5;}
  .readiness-panel .btn{width:100%;}

  /* ---------- Small screens / phones ---------- */
  @media (max-width:600px){
    #app{padding:20px 14px 48px;}
    .home-header h1{font-size:2.21rem;}
    .hero-subtitle{font-size:.95rem;}
    .header-divider{margin:16px 0 20px;}
    .fw-header h1{font-size:3.90rem;}
    .fw-header .fw-subheader{font-size:.92rem;}
    .card{padding:16px;}
    .fields{padding:4px 14px;}
    .action-bar{flex-direction:column;align-items:stretch;}
    .action-bar .btn{width:100%;text-align:center;padding:13px 16px;font-size:1rem;}
    .preview-header{flex-wrap:wrap;gap:8px;}
    .preview-header .btn{padding:10px 14px;}
  }
</style>
</head>

/* ==========================================================================
   Colour theme switcher — Studio Slate / Deep Aurora Glass / Warm Editorial
   ========================================================================== */
const THEME_KEY = 'aiPromptBuilderTheme';
const VALID_THEMES = ['slate', 'aurora', 'editorial'];

function getStoredTheme(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    return VALID_THEMES.includes(saved) ? saved : null;
  } catch(e){ return null; }
}

function applyTheme(id){
  document.documentElement.setAttribute('data-theme', id);
  document.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === id);
  });
}

function setTheme(id){
  if (!VALID_THEMES.includes(id)) return;
  applyTheme(id);
  try { localStorage.setItem(THEME_KEY, id); } catch(e){ /* ignore */ }
}

/* Apply the saved (or default) theme immediately — this script tag runs
   after the settings markup above it, so the buttons already exist. */
applyTheme(getStoredTheme() || 'aurora');

/* ==========================================================================
   Settings menu (Appearance + Output folder) — a single persistent panel
   that lives outside #app, so it survives page-to-page navigation.
   ========================================================================== */
function toggleSettings(forceState){
  const panel = document.getElementById('settings-panel');
  const toggleBtn = document.getElementById('settings-toggle-btn');
  if (!panel || !toggleBtn) return;
  const shouldOpen = typeof forceState === 'boolean' ? forceState : panel.hasAttribute('hidden');
  if (shouldOpen){
    panel.removeAttribute('hidden');
    toggleBtn.setAttribute('aria-expanded', 'true');
    updateFolderIndicator();
  } else {
    panel.setAttribute('hidden', '');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.settings-wrap');
  if (wrap && !wrap.contains(e.target)) toggleSettings(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleSettings(false);
});

/* ==========================================================================

   ========================================================================== */
function route(){
  const hash = decodeURIComponent(location.hash.replace('#',''));
  if (hash && FRAMEWORKS[hash]) {
    renderFramework(hash);
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

  app.innerHTML = homeHTML();

function renderFramework(id){
  currentFrameworkId = id;
  const fw = FRAMEWORKS[id];
  document.title = fw.name + ' — AI Prompt Builder';

/* Appended to the end of every generated prompt — fixed reliability
   guardrails and a self-check list for the AI processing the prompt. */
const RELIABILITY_BLOCK = `UNIVERSAL RELIABILITY RULES:

- Do not invent facts, sources, citations, quotations, statistics, names, dates, URLs, product features, APIs, or results.
- Do not guess missing, ambiguous, contradictory, or unverified information.
- Clearly distinguish verified facts, user-provided information, inference, estimate, opinion, and uncertainty.
- If a missing or uncertain detail would materially change the answer, ask one concise clarification question or request user approval before using it.
- Follow the requested output format, audience level, tone, length, and constraints.
- Use clear, natural, specific language. Avoid generic filler, repetition, exaggerated certainty, and stereotypical AI phrasing.
- Do not expose private chain-of-thought. Provide only the answer, essential reasoning summary, assumptions, calculations, evidence, or limitations needed by the user.


FRAMEWORK CHECKLIST:

[ ] Have I completed every explicit requested task?
[ ] Have I followed the requested format, tone, length, audience, and constraints?
[ ] Have I avoided invented facts, unsupported assumptions, and fabricated citations?
[ ] Have I clearly labelled any material uncertainty, inference, estimate, or limitation?
[ ] Have I used a natural, direct, non-repetitive writing style?
[ ] If uncertainty materially affects the answer, have I asked for clarification or user approval rather than guessing?`;

/* Builds the compiled "- Label: value" lines for the currently open
   framework, from whatever is in the fields right now, plus the fixed
   reliability rules and checklist appended at the end. */
function getCompiledContent(){
  if (!currentFrameworkId) return { lines: [], content: '' };
  const fw = FRAMEWORKS[currentFrameworkId];
  const lines = [];
  fw.fields.forEach((f, i) => {
    const el = document.getElementById(`field-input-${i}`);
    const val = el ? el.value.trim() : '';
    if (val) lines.push(`- ${f.label}: ${val}`);
  });
  const content = lines.length
    ? lines.join('\n') + '\n\n' + RELIABILITY_BLOCK + '\n'
    : '';
  return { lines, content };
}

/* Keeps the "Compiled prompt" preview in sync with the fields as the
   user types — no need to click Generate first to see it. */
function updatePreview(){
  const previewEl = document.getElementById('preview-box');
  if (!previewEl) return;
  const { content } = getCompiledContent();
  previewEl.value = content;
  const statusLine = document.getElementById('preview-status-line');
  if (statusLine && currentFrameworkId){
    const fw = FRAMEWORKS[currentFrameworkId];
    statusLine.textContent = `${fw.name} · ${content ? 'Ready for review' : 'Not generated yet'}`;
  }
}

/* ==========================================================================
   Field completion state — shared by the field rows, the progress stepper,
   and the Prompt Readiness panel. Truthful and simple by design: a field
   counts as complete only when it has actual non-whitespace text. This
   never claims anything about correctness, safety or quality.
   ========================================================================== */
function getFieldStates(fw){
  return fw.fields.map((f, i) => {
    const el = document.getElementById(`field-input-${i}`);
    return !!(el && el.value.trim().length > 0);
  });
}

function refreshFrameworkUI(){
  if (!currentFrameworkId) return;
  const fw = FRAMEWORKS[currentFrameworkId];
  const states = getFieldStates(fw);
  updatePreview();
  updateFieldRowStates(states);
  updateStepper(fw, states);
  updateReadinessPanel(fw, states);
}

function updateFieldRowStates(states){
  document.querySelectorAll('.field-row').forEach((row, i) => {
    row.classList.toggle('is-complete', !!states[i]);
  });
}

function updateStepper(fw, states){
  const el = document.getElementById('fw-stepper');
  if (!el) return;
  el.innerHTML = fw.fields.map((f, i) => {
    const complete = states[i];
    const connector = i < fw.fields.length - 1
      ? `<span class="fw-step-connector${states[i] ? ' is-filled' : ''}"></span>`
      : '';
    return `<div class="fw-step${complete ? ' is-complete' : ''}">
      <div class="fw-step-main">
        <span class="fw-step-dot" aria-hidden="true">${complete ? '✓' : String(i + 1).padStart(2, '0')}</span>
        <span class="fw-step-label">${escapeHtml(f.short)}</span>
      </div>
      ${connector}
    </div>`;
  }).join('');
}

function updateReadinessPanel(fw, states){
  const listEl = document.getElementById('readiness-list');
  const barEl = document.getElementById('readiness-bar-fill');
  const countEl = document.getElementById('readiness-count');
  const nextEl = document.getElementById('readiness-next-text');
  if (!listEl) return;

  const total = fw.fields.length;
  const completed = states.filter(Boolean).length;

  listEl.innerHTML = fw.fields.map((f, i) => {
    const complete = states[i];
    const icon = complete
      ? '<svg class="readiness-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5 6.2 12 13 4"/></svg>'
      : '<svg class="readiness-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="5.5"/></svg>';
    return `<li class="readiness-item${complete ? ' is-complete' : ''}">
      <span class="readiness-item-name">${escapeHtml(f.short)}</span>
      <span class="readiness-item-state">${icon}${complete ? 'Complete' : 'Not started'}</span>
    </li>`;
  }).join('');

  if (barEl) barEl.style.width = `${total ? Math.round((completed / total) * 100) : 0}%`;
  if (countEl) countEl.textContent = `${completed} of ${total} complete`;
  if (nextEl){
    nextEl.textContent = completed >= total
      ? 'All sections have content — review the compiled prompt below before generating.'
      : (NEXT_STEP[currentFrameworkId] || '');
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToPreview(){
  const box = document.getElementById('preview-box');
  if (!box) return;
  box.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
  box.focus({ preventScroll: true });
}

}

/* ==========================================================================
   IndexedDB helpers — used to remember the chosen output folder
   ========================================================================== */
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('aiPromptBuilderDB', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    const req = tx.objectStore('handles').put(value, key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ==========================================================================
   Output folder handling (File System Access API, Chrome/Edge)
   ========================================================================== */
async function getDirectoryHandle(forcePick){
  if (!supportsDirectoryPicker()) return null;

  if (!forcePick){
    if (cachedDirHandle) return cachedDirHandle;
    try {
      const stored = await idbGet('outputDir');
      if (stored){
        const perm = await stored.queryPermission({ mode:'readwrite' });
        if (perm === 'granted'){
          cachedDirHandle = stored;
          return stored;
        }
        if (perm === 'prompt'){
          const reqPerm = await stored.requestPermission({ mode:'readwrite' });
          if (reqPerm === 'granted'){
            cachedDirHandle = stored;
            return stored;
          }
        }
      }
    } catch(e){ /* fall through to picker */ }
  }

  const handle = await window.showDirectoryPicker({ id:'ai-prompt-output', mode:'readwrite' });
  await idbSet('outputDir', handle);
  cachedDirHandle = handle;
  return handle;
}

async function updateFolderIndicator(){
  const el = document.getElementById('settings-folder-status');
  const changeBtn = document.getElementById('settings-folder-btn');
  if (!el) return;

  if (!supportsDirectoryPicker()){
    if (changeBtn) changeBtn.style.display = 'none';
    el.textContent = supportsShare()
      ? "This device saves files as a normal download. Use \"Share…\" after generating to send the file straight to OneDrive, Files, email or another app."
      : "This browser doesn't support automatic folder saving (try Chrome or Edge on a computer) — files will download normally instead.";
    return;
  }
  if (changeBtn) changeBtn.style.display = '';
  try {
    const stored = cachedDirHandle || await idbGet('outputDir');
    if (stored){
      el.textContent = `Currently saving to: "${stored.name}".`;
    } else {
      el.textContent = "Not set yet — you'll be asked to choose one the first time you generate a prompt.";
    }
  } catch(e){
    el.textContent = "Not set yet.";
  }
}

async function handleChangeFolder(){
  const folderStatusEl = document.getElementById('settings-folder-status');
  const pageStatusEl = document.getElementById('status-msg'); // only present on a framework page
  if (!supportsDirectoryPicker()){
    if (folderStatusEl){
      folderStatusEl.textContent = "This browser doesn't support choosing a folder automatically (try Chrome or Edge). Files will download normally.";
    }
    return;
  }
  try {
    await getDirectoryHandle(true);
    updateFolderIndicator();
    if (pageStatusEl){
      pageStatusEl.textContent = 'Output folder updated.';
      pageStatusEl.className = 'status success';
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
    console.error(e);
    if (folderStatusEl) folderStatusEl.textContent = 'Could not set the output folder.';
  }
}

/* ==========================================================================
   Filename numbering — PromptXXXDDMMYYYY.txt, per-browser daily counter
   ========================================================================== */
function nextFilename(){
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const dateStr = `${dd}${mm}${yyyy}`;

  const counters = JSON.parse(localStorage.getItem('aiPromptBuilderCounters') || '{}');
  const next = (counters[dateStr] || 0) + 1;
  counters[dateStr] = next;

  return {
    filename: `Prompt${String(next).padStart(3,'0')}${dateStr}.txt`,
    commit: () => localStorage.setItem('aiPromptBuilderCounters', JSON.stringify(counters))
  };
}

/* ==========================================================================
   Generate / Save / Copy / Clear
   ========================================================================== */
async function handleGenerate(){
  if (!currentFrameworkId) return;
  const statusEl = document.getElementById('status-msg');
  const previewEl = document.getElementById('preview-box');

  const { lines, content } = getCompiledContent();

  if (lines.length === 0){
    statusEl.textContent = 'Please fill in at least one field before generating.';
    statusEl.className = 'status error';
    return;
  }

  previewEl.value = content;

  const { filename, commit } = nextFilename();
  lastGenerated = { filename, content };
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) shareBtn.removeAttribute('disabled');

  if (supportsDirectoryPicker()){
    try {
      const dirHandle = await getDirectoryHandle(false);
      const fileHandle = await dirHandle.getFileHandle(filename, { create:true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      commit();
      updateFolderIndicator();
      statusEl.innerHTML = `Saved as <strong>${escapeHtml(filename)}</strong> to "${escapeHtml(dirHandle.name)}".`;
      statusEl.className = 'status success';
      return;
    } catch(e){
      if (e && e.name === 'AbortError'){
        statusEl.textContent = 'Folder selection was cancelled — file not saved. Click Generate again to retry.';
        statusEl.className = 'status error';
        return;
      }
      console.error(e);
      /* fall through to plain download */
    }
  }

  commit();
  const blob = new Blob([content], { type:'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusEl.innerHTML = `Downloaded as <strong>${escapeHtml(filename)}</strong>. Your browser doesn't support automatic folder saving, so move the file into your output folder manually.`;
  statusEl.className = 'status success';
}

async function handleShare(){
  const statusEl = document.getElementById('status-msg');
  if (!lastGenerated){
    statusEl.textContent = 'Generate a prompt first, then you can share it.';
    statusEl.className = 'status error';
    return;
  }
  try {
    const file = new File([lastGenerated.content], lastGenerated.filename, { type:'text/plain' });
    if (navigator.canShare && !navigator.canShare({ files:[file] })){
      throw new Error('file-sharing-unsupported');
    }
    await navigator.share({ files:[file], title:lastGenerated.filename });
  } catch(e){
    if (e && e.name === 'AbortError') return; // user dismissed the share sheet
    statusEl.textContent = "Couldn't open the share sheet on this device — use Copy to clipboard instead.";
    statusEl.className = 'status error';
  }
}

async function handleCopy(){
  const box = document.getElementById('preview-box');
  const statusEl = document.getElementById('status-msg');
  if (!box.value){
    statusEl.textContent = 'Nothing to copy yet — click Generate first.';
    statusEl.className = 'status error';
    return;
  }
  try {
    await navigator.clipboard.writeText(box.value);
    statusEl.textContent = 'Copied to clipboard.';
    statusEl.className = 'status success';
  } catch(e){
    box.removeAttribute('readonly');
    box.focus();
    box.select();
    document.execCommand('copy');
    box.setAttribute('readonly', 'true');
    statusEl.textContent = 'Copied to clipboard.';
    statusEl.className = 'status success';
  }
}

function handleClear(){
  if (!currentFrameworkId) return;
  const fw = FRAMEWORKS[currentFrameworkId];
  fw.fields.forEach((f, i) => {
    document.getElementById(`field-input-${i}`).value = '';
  });
  lastGenerated = null;
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) shareBtn.setAttribute('disabled', 'true');
  const statusEl = document.getElementById('status-msg');
  statusEl.textContent = '';
  statusEl.className = 'status';
  refreshFrameworkUI();
}
